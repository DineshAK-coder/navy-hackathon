<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HullGuard AI | Naval Command Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --navy-bg: #020617;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --cyan-glow: #06b6d4;
            --alert-red: #f43f5e;
            --military-gold: #fbbf24;
            --border-color: #1e293b;
        }

        body {
            background-color: var(--navy-bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden; /* Prevent body scroll to keep it as a dashboard */
            height: 100vh;
        }

        /* --- STYLISH NAVBAR (Triple-Swap Logic) --- */
        .navbar {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            transition: 0.3s all ease;
        }

        .nav-icon { font-size: 1.2rem; transition: transform 0.3s; }
        .nav-text { display: none; font-family: 'Orbitron'; font-size: 0.75rem; letter-spacing: 1px; }

        /* Logic: Swap text in on hover or active state */
        .nav-item:hover .nav-text, .nav-item.active .nav-text { display: inline; color: var(--cyan-glow); }
        .nav-item:hover .nav-icon, .nav-item.active .nav-icon { color: var(--cyan-glow); transform: scale(1.1); }

        /* --- DASHBOARD LAYOUT --- */
        .dashboard-container {
            padding: 20px;
            height: calc(100vh - 70px);
        }

        .military-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--cyan-glow);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .military-card:hover { border-color: #334155; }
        
        /* Fixed Graph Container Fix */
        .chart-box {
            position: relative;
            flex-grow: 1; /* Fills remaining space in card */
            min-height: 0; /* Important for Chart.js inside Flexbox */
            width: 100%;
        }

        .card-title {
            font-family: 'Orbitron';
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: 'Orbitron';
            font-size: 2rem;
            font-weight: 700;
            color: var(--cyan-glow);
        }

        .alert-active { border-left-color: var(--alert-red); }
        .alert-active .stat-value { color: var(--alert-red); text-shadow: 0 0 10px rgba(244, 63, 94, 0.4); }

        .logo-text { font-family: 'Orbitron'; font-weight: 700; color: #fff; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo-text">HULL<span style="color:var(--cyan-glow)">GUARD</span> AI</div>
        <ul class="nav-links">
            <li class="nav-item active"><span class="nav-icon">⛯</span><span class="nav-text">TACTICAL</span></li>
            <li class="nav-item"><span class="nav-icon">⚓</span><span class="nav-text">FLEET</span></li>
            <li class="nav-item"><span class="nav-icon">🛡</span><span class="nav-text">SECURITY</span></li>
        </ul>
        <div class="logo-text" style="font-size: 0.7rem; color: #64748b;">NAVY COMMAND v2.0</div>
    </nav>

    <div class="container-fluid dashboard-container">
        <div class="row h-100">
            <div class="col-lg-3 d-flex flex-column">
                <div class="military-card">
                    <div class="card-title">Active Vessel</div>
                    <div style="font-size: 1.2rem; font-weight: 600;">INS-VIKRANT (R11)</div>
                    <div style="font-size: 0.7rem; color: #4ade80;">● SYSTEM ONLINE</div>
                </div>

                <div class="military-card alert-active" id="alert-panel">
                    <div class="card-title">Drag Efficiency Loss</div>
                    <div class="stat-value" id="loss-val">0.0%</div>
                    <div style="font-size: 0.7rem; margin-top: 5px; color: #94a3b8;">Threshold: 8.0% | Status: CRITICAL</div>
                </div>

                <div class="military-card">
                    <div class="card-title">Daily Operating Loss</div>
                    <div class="stat-value" style="color: var(--military-gold);" id="cost-val">₹0</div>
                    <div style="font-size: 0.7rem; margin-top: 5px; color: #94a3b8;">Fuel waste due to biofouling drag</div>
                </div>
            </div>

            <div class="col-lg-9 d-flex flex-column">
                <div class="military-card d-flex flex-column h-100">
                    <div class="card-title">Performance Deviation Analysis (Live AI Feed)</div>
                    <div class="chart-box">
                        <canvas id="hullChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                // Latest 50 data points for clarity
                const recent = data.slice(-50);
                const latest = recent[recent.length - 1];

                // Update UI Elements
                document.getElementById('loss-val').innerText = latest.efficiency_loss.toFixed(1) + '%';
                
                // Calculation: Efficiency Loss % * Estimated daily fuel (5000L) * Price (₹100)
                const waste = (latest.efficiency_loss / 100) * 5000 * 100;
                document.getElementById('cost-val').innerText = '₹' + Math.floor(waste).toLocaleString();

                // Setup Chart
                const ctx = document.getElementById('hullChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: recent.map(d => d.date.split(' ')[0]), // Date only
                        datasets: [{
                            label: 'Predicted Speed (Clean)',
                            data: recent.map(d => d.predicted_speed),
                            borderColor: '#06b6d4',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.4
                        }, {
                            label: 'Actual Speed (Fouled)',
                            data: recent.map(d => d.actual_speed_knots),
                            borderColor: '#f43f5e',
                            borderWidth: 2,
                            backgroundColor: 'rgba(244, 63, 94, 0.1)',
                            fill: true,
                            pointRadius: 2,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false, // STOPS THE GRAPH FROM MOVING DOWN
                        plugins: {
                            legend: { labels: { color: '#94a3b8', font: { family: 'Orbitron', size: 10 } } }
                        },
                        scales: {
                            y: { 
                                grid: { color: 'rgba(255,255,255,0.05)' },
                                ticks: { color: '#64748b', font: { family: 'Orbitron' } }
                            },
                            x: { 
                                grid: { display: false },
                                ticks: { color: '#64748b', font: { size: 9 }, maxRotation: 45 }
                            }
                        }
                    }
                });

            } catch (err) {
                console.error("Data Fetch Error:", err);
            }
        }

        window.onload = updateDashboard;
    </script>
</body>
</html>
